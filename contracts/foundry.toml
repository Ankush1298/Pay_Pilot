[profile.default]
solc_version = "0.8.24"
src = "."
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
skip = ["lib/**", "out/**", "cache/**"]
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
